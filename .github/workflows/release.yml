name: TOTAL Release Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 🏗 Force Build
        run: |
          # Удаляем строку импорта, которая ломает сборку, если она есть
          sed -i '/"github.com\/karamik\/CostProfiler\/ebpf"/d' main.go
          
          # Настройка модуля с нуля
          rm -f go.mod go.sum
          go mod init cost-profiler
          go mod tidy
          
          # Компиляция
          go build -v -o cost-profiler main.go

      - name: 🚀 Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: cost-profiler
          tag_name: v0.1.0-alpha
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
