name: TOTAL Release Pipeline

on:
  workflow_dispatch:
  release:
    types: [published, edited]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 🏗 Build Cost Profiler
        run: |
          # Инициализируем модуль, чтобы Go не ругался
          go mod init github.com/karamik/CostProfiler || true
          go mod tidy
          
          # Собираем чистый Go бинарник
          go build -o cost-profiler main.go

      - name: 🚀 Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: cost-profiler
          tag_name: ${{ github.event.release.tag_name || 'v0.1.0-alpha' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
