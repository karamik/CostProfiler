name: TOTAL Release Pipeline

on:
  workflow_dispatch: # Кнопка ручного запуска
  release:
    types: [published, edited]

jobs:
  build-and-upload:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: 📦 Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-headers-generic

      - name: 🏗 Prepare and Build Static Binary
        run: |
          # Инициализируем модуль, если его нет
          if [ ! -f go.mod ]; then
            go mod init github.com/karamik/CostProfiler
          fi
          
          # Указываем Go использовать локальную папку ebpf вместо поиска в интернете
          go mod edit -replace github.com/karamik/CostProfiler/ebpf=./ebpf
          
          # Скачиваем внешние зависимости (cilium, k8s и др.)
          go mod tidy
          
          # Собираем бинарник с поддержкой eBPF (CGO_ENABLED=1)
          CGO_ENABLED=1 go build -ldflags="-s -w" -o cost-profiler cmd/cost-profiler/main.go

      - name: 🚀 Upload Artifact to Release
        uses: softprops/action-gh-release@v1
        with:
          files: cost-profiler
          tag_name: ${{ github.event.release.tag_name || 'v0.1.0-alpha' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
