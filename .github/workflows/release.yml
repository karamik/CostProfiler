name: TOTAL Release Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 🏗 Nuclear Isolation Build
        run: |
          # 1. Создаем абсолютно пустую временную папку вне корня
          mkdir /tmp/build_zone
          
          # 2. Копируем ТУДА только один файл main.go
          cp main.go /tmp/build_zone/main.go
          cd /tmp/build_zone
          
          # 3. Чистим код от импорта ebpf прямо там
          sed -i '/"github.com\/karamik\/CostProfiler\/ebpf"/d' main.go
          
          # 4. Собираем бинарник в режиме одного файла (без модулей)
          # Это гарантирует, что Go не будет искать никакие папки ebpf или файлы go.mod
          GO111MODULE=off go build -o cost-profiler main.go
          
          # 5. Возвращаем готовый файл в рабочую директорию GitHub
          cp cost-profiler ${{ github.workspace }}/cost-profiler

      - name: 🚀 Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: cost-profiler
          tag_name: v0.1.0-alpha
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
