name: TOTAL Release Pipeline

on:
  workflow_dispatch: # Позволяет запускать сборку кнопкой
  release:
    types: [published, edited] # Запускается при создании или обновлении релиза

jobs:
  build-and-upload:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # Дает права на запись файла в релиз
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: 📦 Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-headers-generic

      - name: 🏗 Build Static Binary
        run: |
          # Собираем статический бинарник для Linux x86_64
          # Используем CGO для линковки с libbpf
          CGO_ENABLED=1 go build -ldflags="-s -w" -o cost-profiler cmd/cost-profiler/main.go

      - name: 🚀 Upload Artifact to Release
        uses: softprops/action-gh-release@v1
        with:
          files: cost-profiler
          # Если запуск ручной, прикрепляем к последнему релизу v0.1.0-alpha
          tag_name: ${{ github.event.release.tag_name || 'v0.1.0-alpha' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
