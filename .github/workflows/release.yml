name: TOTAL Release Pipeline

on:
  workflow_dispatch:
  release:
    types: [published, edited]

jobs:
  build-and-upload:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 📦 Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-headers-generic

      - name: 🏗 Fix and Build
        run: |
          # 1. Форсируем создание модуля, если его нет
          go mod init github.com/karamik/CostProfiler || true
          
          # 2. Очищаем старые зависимости
          rm -f go.sum
          
          # 3. Пытаемся подтянуть зависимости без привязки к локальным пакетам
          go mod tidy
          
          # 4. Собираем напрямую через путь к файлу
          # Это обходит ошибки "package not found" в подпапках
          CGO_ENABLED=1 go build -v -ldflags="-s -w" -o cost-profiler ./cmd/cost-profiler/main.go

      - name: 🚀 Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: cost-profiler
          tag_name: ${{ github.event.release.tag_name || 'v0.1.0-alpha' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
