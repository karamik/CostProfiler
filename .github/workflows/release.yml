name: TOTAL Release Pipeline

on:
  workflow_dispatch:
  release:
    types: [published, edited]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 🔍 DEBUG: Show Files and Content
        run: |
          echo "--- ТЕКУЩИЕ ФАЙЛЫ В КОРНЕ ---"
          ls -la
          echo "--- ПРОВЕРКА СОДЕРЖИМОГО main.go ---"
          head -n 5 main.go || echo "Файл main.go не найден!"

      - name: 🏗 Clean Build
        run: |
          go mod init cost-profiler || true
          go mod tidy
          # Пытаемся собрать и выводим ВСЕ ошибки в консоль
          go build -o cost-profiler . 2>&1 || (echo "ОШИБКА СБОРКИ!" && exit 1)

      - name: 🚀 Upload to Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          files: cost-profiler
          tag_name: ${{ github.event.release.tag_name || 'v0.1.0-alpha' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
