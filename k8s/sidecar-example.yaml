apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-with-cost-profiler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      serviceAccountName: cost-profiler-sa
      hostPID: true
      containers:
      - name: app
        image: your-app:latest
        # ... остальные настройки вашего приложения
      - name: cost-profiler
        image: karamik/cost-profiler:latest
        args:
          - "--pid"
          - "1"
          - "--binary"
          - "/app/service"
          - "--web"
          - ":8080"
        ports:
        - containerPort: 8080
        securityContext:
          privileged: true
        volumeMounts:
        - name: proc
          mountPath: /proc
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: proc
        hostPath:
          path: /proc
      - name: tmp
        hostPath:
          path: /tmp
