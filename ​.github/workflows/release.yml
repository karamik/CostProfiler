name: TOTAL Release Pipeline

on:
  workflow_dispatch:
  release:
    types: [published, edited]

jobs:
  build-and-upload:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 📦 Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-headers-generic

      - name: 🏗 Build
        run: |
          # Проверяем структуру файлов, чтобы не гадать
          ls -R
          
          # Настраиваем модули
          go mod init github.com/karamik/CostProfiler || true
          go mod edit -replace github.com/karamik/CostProfiler/ebpf=./ebpf || true
          
          # Принудительно качаем зависимости
          go mod download
          go mod tidy
          
          # Сборка с подробным выводом ошибок (-v)
          CGO_ENABLED=1 go build -v -ldflags="-s -w" -o cost-profiler cmd/cost-profiler/main.go

      - name: 🚀 Upload
        uses: softprops/action-gh-release@v1
        with:
          files: cost-profiler
          tag_name: ${{ github.event.release.tag_name || 'v0.1.0-alpha' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
