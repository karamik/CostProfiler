name: Build
on:
  workflow_dispatch: # Это создаст кнопку ручного запуска
  push:
    tags:
      - 'v*' # Запустится сам, если создашь тег v...

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install libbpf
        run: sudo apt-get update && sudo apt-get install -y libbpf-dev
      - name: Build
        run: go build -o cost-profiler cmd/cost-profiler/main.go
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cost-profiler-bin
          path: cost-profiler
