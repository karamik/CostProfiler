name: TOTAL Release Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 🏗 Absolute Build
        run: |
          # 1. Убираем всё, что может вызвать ошибку в коде
          sed -i '/"github.com\/karamik\/CostProfiler\/ebpf"/d' main.go
          
          # 2. Инициализируем пустой модуль, чтобы Go не искал ничего вовне
          go mod init build
          go mod tidy || true
          
          # 3. Сборка конкретного файла
          go build -o cost-profiler main.go

      - name: 🚀 Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: cost-profiler
          tag_name: v0.1.0-alpha
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
